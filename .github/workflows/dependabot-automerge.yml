# Auto-merges Dependabot PRs (all update types, including major) once the
# `CI` workflow's required status checks pass.
#
# One-time manual setup this depends on (can't be done from a workflow file):
#   1. Settings -> General -> Pull Requests -> enable "Allow auto-merge".
#   2. Settings -> Branches -> add a protection rule for `main` that requires
#      the `Backend tests (pytest)` and `Frontend tests (vitest)` status
#      checks (from ci.yml) before merging. Leave "Require branches to be up
#      to date" off, or each merge makes the remaining PRs need a rebase.
# Without both, `gh pr merge --auto` below either merges immediately without
# waiting for CI or fails with "Protected branch rules not configured".
#
# Optional: a Dependabot secret (Settings -> Secrets and variables ->
# Dependabot; Dependabot PRs can't read Actions secrets) named
# DEPENDABOT_AUTOMERGE_PAT, holding a fine-grained PAT limited to this repo
# with read/write on Contents, Pull requests and Workflows. An expired PAT
# makes auto-merge fail rather than fall back. Without the secret, the step
# below uses GITHUB_TOKEN, which has two limitations:
#   - Its merges don't trigger push workflows on `main`. ci.yml also runs on a
#     weekly schedule to compensate.
#   - `github-actions` PRs, which touch workflow files, may need merging by
#     hand. npm and pip PRs are unaffected.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Enable auto-merge for the Dependabot PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
